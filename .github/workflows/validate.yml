name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: python -m pip install check-jsonschema
      - run: check-jsonschema --schemafile schemas/index-v1.schema.json index.json
      - run: check-jsonschema --schemafile schemas/automation-v3.schema.json plugins/*.json
      # validate.py is the install-time dry run (runtime whitelist, job/module
      # binding, module exports); verify_signatures.go proves each bundle is
      # still signed over the canonical bytes the gateway verifies.
      - run: make check
