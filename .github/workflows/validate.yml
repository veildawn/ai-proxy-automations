name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install check-jsonschema
      - run: check-jsonschema --schemafile schemas/index-v1.schema.json index.json
      - run: check-jsonschema --schemafile schemas/automation-v3.schema.json automations/*.json
      - run: python scripts/validate.py
